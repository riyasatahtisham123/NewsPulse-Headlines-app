<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NewsPulse — Live Headlines</title>
<meta name="description" content="NewsPulse — a modern live news reader with real headlines from BBC, NDTV, Times of India and more." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="bar" class="progress"></div>

<!-- ===== HEADER ===== -->
<header class="head">
  <div class="head-in">
    <a class="logo" href="#" data-act="top">
      <span class="logo-mark"></span>
      <span class="logo-txt">News<b>Pulse</b></span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search headlines…  ( / )" autocomplete="off" aria-label="Search headlines" />
      <button id="qclear" class="qclear" hidden aria-label="Clear search">✕</button>
    </div>

    <div class="head-acts">
      <button id="savedBtn" class="icon-btn" title="Saved stories" aria-label="Saved stories">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
        <span class="badge" id="savedCount">0</span>
      </button>
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <button id="refreshBtn" class="icon-btn spin-on" title="Refresh (r)" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </div>

  <nav class="cats" id="cats" aria-label="Categories"></nav>
</header>

<!-- ===== MAIN ===== -->
<main class="wrap">
  <section class="status">
    <div>
      <h1 class="h-line" id="catTitle">Top Stories</h1>
      <p class="sub" id="meta">Loading live headlines…</p>
    </div>
    <div class="live" id="liveTag"><i></i> LIVE</div>
  </section>

  <div id="notice" class="notice" hidden></div>

  <section id="heroSlot" aria-label="Featured story"></section>

  <section id="grid" class="grid" aria-live="polite"></section>

  <div id="more" class="more-wrap" hidden><button class="more" id="moreBtn">Load more stories</button></div>

  <div id="empty" class="empty" hidden>
    <div class="empty-ic">🗞️</div>
    <h3>No stories found</h3>
    <p id="emptyMsg">Try another category, or check your internet connection.</p>
    <button class="pill-btn" data-act="retry">Try again</button>
  </div>
</main>

<footer class="foot">
  <span>NewsPulse · headlines load live from public news feeds</span>
  <span class="dot">·</span>
  <span>Press <kbd>/</kbd> to search, <kbd>r</kbd> to refresh</span>
</footer>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
